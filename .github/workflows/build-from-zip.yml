# Phone-friendly setup: put this file at .github/workflows/build-from-zip.yml in your GitHub repo
# and upload astra-project.zip to the repo root. Every push builds the APK and publishes it under Releases.
# v0.3: newer action versions (no Node 20 warnings), fixed Ubuntu image, Android 37 SDK installed,
# and on failure a short list of the exact errors appears on the run's Summary page.
name: Build ASTRA (from zip)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history, so we can tell which zip was uploaded most recently

      - name: Unpack the project zip
        run: |
          shopt -s nullglob
          ZIPS=( *.zip )
          if [ ${#ZIPS[@]} -eq 0 ]; then echo "::error::Upload astra-project.zip to the repository root first"; exit 1; fi
          # Pick the zip that was committed most recently (not just the first name alphabetically).
          Z=""; ZT=0
          for f in "${ZIPS[@]}"; do
            t=$(git log -1 --format=%ct -- "$f" 2>/dev/null || echo 0); t=${t:-0}
            if [ "$t" -ge "$ZT" ]; then ZT=$t; Z="$f"; fi
          done
          if [ ${#ZIPS[@]} -gt 1 ]; then
            echo "::warning::Found ${#ZIPS[@]} zip files (${ZIPS[*]}). Building the newest: $Z. Delete the old ones to avoid confusion."
          fi
          mkdir -p src && unzip -o -q "$Z" -d src
          cat > .astra-report.sh <<'REPORT'
          # Turns a failed Gradle log into GitHub annotations (shown at the top of the run, under "Annotations")
          # and a box on the Summary page, so the exact errors are easy to copy.
          LOG="$1"; TITLE="$2"
          if [ ! -f "$LOG" ]; then echo "::error title=$TITLE::No log file was produced — see the step's output above."; exit 0; fi
          # 1) Code errors (Kotlin, KSP/Room, resources, manifest): the exact file:line lines.
          ERR=$(grep -E "^e: |^ERROR:|^error: |: error: |\[ksp\].*(error|Error)|AAPT: error|Manifest merger failed" "$LOG" \
                | sed -E 's#file:///home/runner/work/[^/]+/[^/]+/src/##; s#/home/runner/work/[^/]+/[^/]+/src/##' | awk '!seen[$0]++' | head -60)
          # 2) Otherwise Gradle's own explanation (dependencies, SDK, configuration problems).
          if [ -z "$ERR" ]; then
            ERR=$(sed -n '/What went wrong/,/\* Try/p' "$LOG" | grep -vE "^\* Try|^ *$" | awk '!seen[$0]++' | head -40)
          fi
          [ -z "$ERR" ] && ERR=$(tail -40 "$LOG")
          N=$(printf '%s\n' "$ERR" | grep -c .)
          ENC=$(printf '%s' "$ERR" | sed -e 's/%/%25/g' -e 's/\r//g' | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::error title=$TITLE — $N error line(s), copy this::$ENC"
          printf '%s\n' "$ERR" | head -8 | while IFS= read -r l; do echo "::error title=$TITLE::$l"; done
          { echo "## $TITLE"; echo; echo '```'; printf '%s\n' "$ERR"; echo '```'; echo; echo "Copy or screenshot this box and send it back."; } >> "$GITHUB_STEP_SUMMARY"
          REPORT
          sed -i 's/^          //' .astra-report.sh
          if [ -d src/astra ]; then P=src/astra; else P=src; fi
          echo "PROJECT=$P" >> "$GITHUB_ENV"
          VER=$(grep -oE 'versionName = "[^"]+"' "$P/app/build.gradle.kts" | cut -d'"' -f2)
          SDK=$(grep -oE 'compileSdk = [0-9]+' "$P/app/build.gradle.kts" | grep -oE '[0-9]+')
          echo "Building ASTRA $VER (compileSdk $SDK) from $Z"
          {
            echo "## Building ASTRA $VER"
            echo "- Zip: \`$Z\` (uploaded $(date -u -d @"$ZT" '+%Y-%m-%d %H:%M UTC' 2>/dev/null || echo unknown))"
            echo "- compileSdk: $SDK"
            echo "- Commit: \`${GITHUB_SHA::7}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - name: Install Android SDK platform 37
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-37" || echo "Will let Gradle download it instead"

      - name: Core engine tests
        working-directory: ${{ env.PROJECT }}
        run: |
          chmod +x gradlew
          set +e
          ./gradlew :core:test --stacktrace 2>&1 | tee core.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then bash ../.astra-report.sh core.log "Core tests failed" || true; fi
          exit $status

      - name: Build debug APK
        working-directory: ${{ env.PROJECT }}
        run: |
          set +e
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --continue 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then bash ../.astra-report.sh build.log "APK build failed" || true; fi
          exit $status

      - name: Keep the full build log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-log
          path: |
            ${{ env.PROJECT }}/build.log
            ${{ env.PROJECT }}/core.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v5
        with:
          name: astra-debug-apk
          path: ${{ env.PROJECT }}/app/build/outputs/apk/debug/*.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ASTRA build ${{ github.run_number }}
          body: Debug build of ASTRA. Install on Android 12+ (allow "install unknown apps").
          files: ${{ env.PROJECT }}/app/build/outputs/apk/debug/*.apk
